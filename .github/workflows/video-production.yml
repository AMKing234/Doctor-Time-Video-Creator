name: Video Production

env:
  AUTOMATION_ENABLED: ${{ vars.AUTOMATION_ENABLED || 'true' }}

on:
  workflow_dispatch:
  workflow_call:
    secrets:
      AI_API_KEY:
        required: false
      IMAGE_API_KEY:
        required: false
      STORAGE_PROVIDER:
        required: false
      S3_BUCKET:
        required: false
      S3_ACCESS_KEY:
        required: false
      S3_SECRET_KEY:
        required: false

jobs:
  produce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install FFmpeg and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu
          pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: production-data
          path: data
        continue-on-error: true
      - name: Voice + visuals + render + SEO + archive
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          IMAGE_API_KEY: ${{ secrets.IMAGE_API_KEY }}
          STORAGE_PROVIDER: ${{ secrets.STORAGE_PROVIDER || 'local' }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
          S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
        run: |
          python main.py --stage voice
          python main.py --stage visual
          python main.py --stage video
          python main.py --stage seo
          python - <<'PY'
          from main import Pipeline
          for item in Pipeline().archive():
              print("ARCHIVED:", item["uri"])
          PY
      - name: Upload only small metadata (media stays in external storage)
        uses: actions/upload-artifact@v4
        with:
          name: production-data
          path: |
            data/**
            !data/**/*.mp4
            !data/**/*.mp3
            !data/**/*.wav
            !data/**/*.jpg
            !data/**/*.png
          overwrite: true
          retention-days: 3
