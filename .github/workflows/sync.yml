name: Local <-> Cloud Sync

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests flask
      - name: Checkout sync branch data
        id: sync_checkout
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: sync
          path: sync-data
      - name: Process bus
        if: steps.sync_checkout.outcome == 'success'
        run: python -m local_agent.cloud_worker --bus sync-data
      - name: Push replies to sync branch
        if: steps.sync_checkout.outcome == 'success'
        run: |
          cd sync-data
          git config user.name "AI Factory Bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "sync: cloud replies"
          git push origin sync
