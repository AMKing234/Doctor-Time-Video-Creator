name: AI Documentary Factory — Orchestrator

env:
  AUTOMATION_ENABLED: ${{ vars.AUTOMATION_ENABLED || 'true' }}

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: documentary-production
  cancel-in-progress: false

jobs:
  research:
    uses: ./.github/workflows/research.yml
    secrets: inherit

  produce:
    needs: research
    uses: ./.github/workflows/video-production.yml
    secrets: inherit

  upload:
    needs: produce
    uses: ./.github/workflows/upload.yml
    secrets: inherit

  analytics:
    needs: upload
    uses: ./.github/workflows/analytics.yml
    secrets: inherit
