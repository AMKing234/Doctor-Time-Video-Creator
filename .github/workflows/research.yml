name: Research & Script

env:
  AUTOMATION_ENABLED: ${{ vars.AUTOMATION_ENABLED || 'true' }}

on:
  workflow_dispatch:
  workflow_call:
    secrets:
      AI_API_KEY:
        required: false
      AI_API_BASE:
        required: false
      AI_MODEL:
        required: false

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Research + bilingual scripts
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_API_BASE: ${{ secrets.AI_API_BASE || 'https://api.openai.com/v1' }}
          AI_MODEL: ${{ secrets.AI_MODEL || 'gpt-4o-mini' }}
        run: |
          python main.py --stage research
          python main.py --stage script
      - name: Prune large files before artifact upload
        run: find data -type f \( -name '*.mp4' -o -name '*.mp3' -o -name '*.wav' \) -delete || true
      - uses: actions/upload-artifact@v4
        with:
          name: production-data
          path: |
            data/**
            !data/**/*.mp4
            !data/**/*.mp3
            !data/**/*.wav
          retention-days: 3
